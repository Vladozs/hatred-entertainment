<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Вход в админку - HATRED</title>
  <style>
    body{background:#000;color:#fff;font-family:Inter,Arial;padding:40px;}
    .box{max-width:420px;margin:50px auto;padding:20px;background:#111;border-radius:10px;border:1px solid rgba(255,255,255,0.04);}
    label,input{display:block;width:100%;margin-bottom:10px;}
    input{padding:10px;border-radius:6px;border:1px solid #333;background:#0b0b0b;color:#fff;}
    .btn{display:inline-block;padding:10px 14px;background:#c50000;border-radius:8px;color:#fff;text-decoration:none;border:none;cursor:pointer;}
    .error{color:#ff6666;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Вход в админ-панель</h2>
    <form id="loginForm" method="post" action="/news/login.php">
      <label>Логин</label>
      <input name="login" required />
      <label>Пароль</label>
      <input name="password" type="password" required />
      <div style="margin-top:8px;">
        <button class="btn" type="submit">Войти</button>
      </div>
      <div id="err" class="error" style="display:none;margin-top:8px;"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const data = new FormData(form);
      const r = await fetch(form.action, { method:'POST', body:data });
      const json = await r.json();
      if(json.success){
        window.location = json.redirect;
      } else {
        const err = document.getElementById('err');
        err.style.display='block'; err.textContent = json.error || 'Ошибка входа';
      }
    });
  </script>
</body>
</html>
