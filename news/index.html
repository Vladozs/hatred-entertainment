<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Новости - HATRED Entertainment</title>
  <meta name="description" content="Игровые новости от HATRED Entertainment" />
  <meta name="keywords" content="hatred, hatred ent, hatred entertainment, хейтред, хатред, хэйтред, ентертейнмент, издатель игр, разработчик игр, российский, steam, google play, vk play, новости игр, новости геймдев, геймдев" />
   
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    :root {
      --bg:#000; --text:#fff; --card:#111; --accent:#c50000;
    }
    body.light { --bg:#fff; --text:#000; --card:#f2f2f2; --accent:#c50000; }
    body {
      background:var(--bg); color:var(--text); margin:0; font-family:Inter,sans-serif;
      transition:background .3s,color .3s;
    }
    .navbar {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 20px; background:var(--card); border-bottom:1px solid rgba(255,255,255,0.1);
      flex-wrap:wrap;
    }
    .navbar .brand {
      display:flex; align-items:center; gap:10px; text-decoration:none;
    }
    .navbar .brand img { width:28px; height:28px; }
    .navbar .brand span {
      font-family:Orbitron, monospace; font-size:1.2rem; color:var(--accent);
    }
    .navbar .controls { display:flex; gap:10px; align-items:center; margin-top:8px; }
    @media(min-width:600px) {
      .navbar .controls { margin-top:0; }
    }
    .navbar input.search {
      padding:8px 12px; border-radius:8px; border:none; outline:none; font-size:0.95rem;
    }
    .btn-theme {
      cursor:pointer; padding:6px 12px; border-radius:8px;
      background:var(--accent); color:#fff; border:none;
    }
    .container {
      max-width:1200px; margin:0 auto; padding:20px; display:flex; flex-wrap:wrap; gap:20px;
    }
    .main { flex:3 1 600px; }
    .sidebar { flex:1 1 280px; background:var(--card); border-radius:12px;
      min-height:200px; display:flex; justify-content:center; align-items:center; color:#777; }
    .news-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }
    .news-card {
      background:var(--card);
      border-radius:16px;
      overflow:hidden;
      transition:.2s;
      display:flex;
      flex-direction:column;
      height:300px;
    }
    .news-card:hover { transform:translateY(-3px); box-shadow:0 6px 20px rgba(0,0,0,0.5); }
    .news-card img {
      width:100%;
      height:160px;
      object-fit:cover;
    }
    .news-card .content {
      padding:12px;
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .news-meta { font-size:0.85rem; color:#888; margin-bottom:6px; }
    .news-card h3 {
      font-family:Orbitron, monospace;
      font-size:1.1rem;
      margin:0 0 6px;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .news-card p {
      color:#888;
      font-size:0.9rem;
      margin:0;
      overflow:hidden;
      text-overflow:ellipsis;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/" class="brand">
      <img src="https://hatred-entertainment.ru/favicon.ico" alt="logo">
      <span>HATRED Entertainment</span>
    </a>
    <div class="controls">
      <input type="text" id="search" class="search" placeholder="Поиск по новостям...">
      <button class="btn-theme" id="themeToggle">Тема</button>
    </div>
  </div>

  <div class="container">
    <div class="main">
      <h1>Новости</h1>
      <p style="color:#888;margin-bottom:1.5rem;">Все обновления, релизы и анонсы</p>
      <div id="news-list" class="news-grid"></div>
    </div>
  </div>

<script>
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
  document.body.classList.remove('light');
  if (t==='light') document.body.classList.add('light');
}
applyTheme(localStorage.getItem('theme') || 'dark');
themeToggle.onclick = () => {
  const newTheme = document.body.classList.contains('light') ? 'dark' : 'light';
  applyTheme(newTheme);
  localStorage.setItem('theme', newTheme);
};

let allArticles = [];
function renderList(filter='') {
  const list = document.getElementById('news-list');
  list.innerHTML = '';
  allArticles
    .filter(a => a.title.toLowerCase().includes(filter) || (a.excerpt||'').toLowerCase().includes(filter))
    .forEach(article=>{
      const a = document.createElement('a');
      a.href = '/news/page/' + (article.slug || 'article-' + article.id) + '.php';
      a.className = 'news-card';
      a.innerHTML = `
        <img src="${article.preview || '/image/hat-red.png'}" alt="${article.title}">
        <div class="content">
          <div class="news-meta">${new Date(article.date).toLocaleDateString('ru-RU')} • <strong style="color:var(--accent)">${article.tag||'Обновление'}</strong></div>
          <h3>${article.title}</h3>
          <p>${article.excerpt || ''}</p>
        </div>
      `;
      list.appendChild(a);
    });
}

fetch('/news/news.json?nocache=' + Date.now())
  .then(r=>r.json())
  .then(json=>{
    if(!json.articles?.length) return;
    allArticles = json.articles.sort((a,b)=> new Date(b.date)-new Date(a.date));
    renderList();
  });

document.getElementById('search').addEventListener('input', e=>{
  renderList(e.target.value.toLowerCase());
});
</script>
</body>
</html>
